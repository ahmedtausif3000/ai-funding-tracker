name: fetch-candidates

on:
  schedule:
    # GitHub starts scheduled workflows late (5 to 9 hours late was observed for a top-of-hour cron), so the
    # fetch runs twice a day at off-peak minutes and never has to land before a deadline: the Claude routine
    # (6:00 AM and 3:00 PM Pacific) processes every fetched-but-unmerged run folder it finds.
    - cron: "17 4 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days (ignored when from is set)"
        default: "2"
      from:
        description: "Backfill start date YYYY-MM-DD (optional)"
        default: ""
      to:
        description: "Backfill end date YYYY-MM-DD (optional, defaults to today)"
        default: ""
      label:
        description: "Run directory name for a backfill (optional)"
        default: ""
      max_groups:
        description: "Max candidate groups"
        default: "150"
      feed_pages:
        description: "Pages to walk on paged feeds (Pulse 2.0 etc.); ~40 covers 10 days"
        default: "6"

permissions:
  contents: write

concurrency:
  group: fetch-candidates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch candidates
        id: fetch
        run: |
          set -o pipefail
          ARGS=(--days "${{ github.event.inputs.days || '2' }}" --max-groups "${{ github.event.inputs.max_groups || '150' }}" --feed-pages "${{ github.event.inputs.feed_pages || '6' }}")
          if [ -n "${{ github.event.inputs.from }}" ]; then ARGS+=(--from "${{ github.event.inputs.from }}"); fi
          if [ -n "${{ github.event.inputs.to }}" ]; then ARGS+=(--to "${{ github.event.inputs.to }}"); fi
          # Run folder: the label input, else today's UTC date; a second fetch on the same day gets a -HHMM suffix
          # so it never overwrites candidates the routine has not merged yet.
          LABEL="${{ github.event.inputs.label }}"
          if [ -z "$LABEL" ]; then
            LABEL="$(date -u +%F)"
            if [ -f "data/runs/$LABEL/candidates.json" ]; then LABEL="$LABEL-$(date -u +%H%M)"; fi
          fi
          ARGS+=(--date "$LABEL")
          node scripts/fetch-candidates.mjs "${ARGS[@]}" 2>&1 | tee fetch.log
          echo "run_date=$LABEL" >> "$GITHUB_OUTPUT"
      - name: Commit candidates
        run: |
          git config user.name "ai-funding-tracker bot"
          git config user.email "ahmedtausif3000@users.noreply.github.com"
          git add data/runs data/url-cache.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fetch: ${{ steps.fetch.outputs.run_date }} candidates [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log-${{ steps.fetch.outputs.run_date }}
          path: fetch.log
          retention-days: 14
